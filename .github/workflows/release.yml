name: Auto release Obsidian plugin

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/prepare-release.mjs'
      - 'manifest.json'
      - 'versions.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - 'rollup.config.js'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: obsidian-plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the release version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/prepare-release.mjs --sync-manifest)"
          # 只用尚未占用的版本，避免复用已发布标签或手工创建的标签。
          while git show-ref --verify --quiet "refs/tags/$version" \
            || gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            version="$(node scripts/prepare-release.mjs --bump-patch)"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm run build
          node --check main.js
          git diff --check
          test -s main.js
          test -s manifest.json

      - name: Commit version changes
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare release $RELEASE_VERSION [skip release]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 先完整上传并核对草稿，GitHub 短暂失败时继续同一份 Release。
          retry() {
            local delay
            for delay in 0 3 8 15; do
              sleep "$delay"
              if "$@"; then return 0; fi
            done
            return 1
          }

          ensure_draft() {
            if gh release view "$RELEASE_VERSION" --json targetCommitish >/dev/null 2>&1; then
              return 0
            fi
            gh release create "$RELEASE_VERSION" --draft \
              --target "$RELEASE_COMMIT" --title "$RELEASE_VERSION" --generate-notes
          }

          upload_asset() {
            local asset="$1" expected="$2" actual
            actual="$(gh release view "$RELEASE_VERSION" --json assets \
              --jq ".assets[] | select(.name == \"$asset\") | .digest")" || return 1
            if [ -z "$actual" ]; then
              gh release upload "$RELEASE_VERSION" "$asset" || return 1
              actual="$(gh release view "$RELEASE_VERSION" --json assets \
                --jq ".assets[] | select(.name == \"$asset\") | .digest")" || return 1
            fi
            test "$actual" = "$expected"
          }

          retry ensure_draft
          target="$(retry gh release view "$RELEASE_VERSION" --json targetCommitish --jq '.targetCommitish')"
          test "$target" = "$RELEASE_COMMIT"
          for asset in main.js manifest.json; do
            digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            retry upload_asset "$asset" "sha256:$digest"
          done
          retry gh release edit "$RELEASE_VERSION" --draft=false
          test "$(retry gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft')" = false
